<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador Docente | Nuria RT 2026/2027</title>
  <meta name="description" content="Planificador docente interactivo para Nuria RT - Curso 2026/2027" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- SheetJS Library for Excel (.xlsx/.xls/.csv) Import -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-parchment: #F6F4EF;
      --bg-card: #FFFFFF;
      --bg-card-subtle: #FDFBF7;
      --text-primary: #1E293B;
      --text-secondary: #475569;
      --text-muted: #64748B;
      
      --ink-blue: #1E2E40;
      --ink-blue-hover: #2C3E55;
      --burgundy: #7A2638;
      --burgundy-light: #FDF2F4;
      --gold-accent: #C49A45;
      --gold-light: #FDF9F0;
      --forest-green: #2E5A44;
      --forest-light: #F0F7F4;

      --tag-no-lectivo-bg: #E2E8F0;
      --tag-no-lectivo-text: #334155;
      --tag-festivo-bg: #2563EB;
      --tag-festivo-text: #FFFFFF;
      --tag-evaluacion-bg: #DCFCE7;
      --tag-evaluacion-text: #15803D;
      --tag-ccp-bg: #FEF08A;
      --tag-ccp-text: #854D0E;
      --tag-claustro-bg: #FAE8FF;
      --tag-claustro-text: #A21CAF;

      --lesson-explicacion-bg: #DCFCE7;
      --lesson-explicacion-text: #15803D;
      --lesson-correccion-bg: #FFEDD5;
      --lesson-correccion-text: #C2410C;
      --lesson-actividades-bg: #F3E8FF;
      --lesson-actividades-text: #7E22CE;
      --lesson-examen-bg: #FEE2E2;
      --lesson-examen-text: #991B1B;
      --lesson-tesa-bg: #FFE4E6;
      --lesson-tesa-text: #9F1239;
      
      --border-color: #E2DCD5;
      --border-subtle: #EFEBE4;
      
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-subheading: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-literary: 'Merriweather', serif;

      --shadow-sm: 0 1px 3px rgba(30, 46, 64, 0.05);
      --shadow-md: 0 4px 12px rgba(30, 46, 64, 0.08);
      --shadow-lg: 0 12px 28px rgba(30, 46, 64, 0.12);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-parchment);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .literary-title {
      font-family: var(--font-heading);
      color: var(--ink-blue);
    }

    .app-container {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow-y: auto;
      height: 100vh;
    }

    .content-body {
      padding: 1.25rem 1.75rem 2.5rem 1.75rem;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 1024px) {
      .content-body { padding: 1rem; }
    }

    .sidebar {
      width: 270px;
      background: #FFFFFF;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      z-index: 40;
      transition: transform 0.3s ease;
      box-shadow: var(--shadow-sm);
    }

    .sidebar-header {
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, #FDFCF9 0%, #FFFFFF 100%);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-subheading);
      font-size: 0.7rem;
      color: var(--gold-accent);
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 0.2rem;
    }

    .sidebar-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--ink-blue);
      line-height: 1.2;
    }

    .sidebar-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      font-family: var(--font-literary);
      margin-top: 0.15rem;
    }

    .sidebar-nav {
      padding: 1rem 0.75rem;
      flex: 1;
      overflow-y: auto;
    }

    .nav-section-title {
      font-size: 0.68rem;
      font-family: var(--font-subheading);
      color: var(--text-muted);
      padding: 0.4rem 0.65rem;
      margin-top: 0.5rem;
      letter-spacing: 0.08em;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.8rem;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: var(--radius-md);
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      margin-bottom: 0.2rem;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background-color: var(--bg-parchment);
      color: var(--ink-blue);
    }

    .nav-item.active {
      background-color: var(--ink-blue);
      color: #FFFFFF;
      font-weight: 600;
      box-shadow: 0 3px 8px rgba(30, 46, 64, 0.18);
    }

    .nav-badge {
      margin-left: auto;
      background: rgba(196, 154, 69, 0.15);
      color: var(--gold-accent);
      padding: 0.1rem 0.45rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .nav-item.active .nav-badge {
      background: rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
    }

    .header-banner {
      position: relative;
      background: linear-gradient(135deg, #1E2E40 0%, #3D1C24 100%);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.75rem;
      color: #FFFFFF;
      margin-bottom: 1.25rem;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .header-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(30, 46, 64, 0.92) 0%, rgba(122, 38, 56, 0.88) 100%);
    }

    .header-content {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .quote-box { max-width: 700px; }

    .quote-text {
      font-family: var(--font-literary);
      font-style: italic;
      font-size: 0.98rem;
      line-height: 1.4;
      color: #F8FAF9;
      margin-bottom: 0.25rem;
    }

    .quote-author {
      font-family: var(--font-subheading);
      font-size: 0.75rem;
      color: var(--gold-accent);
      letter-spacing: 1px;
    }

    .header-actions { display: flex; gap: 0.5rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      font-family: var(--font-body);
    }

    .btn-primary { background-color: var(--ink-blue); color: #FFFFFF; }
    .btn-primary:hover { background-color: var(--ink-blue-hover); transform: translateY(-1px); }
    .btn-secondary { background-color: #FFFFFF; border-color: var(--border-color); color: var(--ink-blue); }
    .btn-secondary:hover { background-color: var(--bg-parchment); }
    .btn-gold { background-color: var(--gold-accent); color: #FFFFFF; }
    .btn-gold:hover { background-color: #B28838; }
    .btn-outline-white { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); color: #FFFFFF; border: 1px solid rgba(255, 255, 255, 0.3); }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.15rem 1.35rem;
      box-shadow: var(--shadow-sm);
    }

    .card.is-important {
      border: 2px solid var(--gold-accent);
      box-shadow: 0 4px 12px rgba(196, 154, 69, 0.18);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .section-title { font-size: 1.35rem; font-weight: 700; }

    .mobile-nav-toggle {
      display: none;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      padding: 0.4rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      color: var(--ink-blue);
    }

    .balanced-2x2-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.15rem;
    }

    .weekly-days-row-5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.75rem;
    }

    .all-months-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .single-month-box {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1rem;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .single-month-box.is-current-month-box {
      border: 2px solid var(--gold-accent);
      box-shadow: 0 4px 12px rgba(196, 154, 69, 0.2);
    }

    .single-month-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink-blue);
      text-transform: capitalize;
      margin-bottom: 0.65rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .month-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.25rem;
      text-align: center;
    }

    .month-day-header {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      padding-bottom: 0.25rem;
    }
    .month-day-header.weekend { color: #DC2626; }

    .month-day-cell {
      min-height: 48px;
      padding: 0.25rem 0.15rem;
      font-size: 0.8rem;
      border-radius: var(--radius-sm);
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
      position: relative;
    }

    .month-day-cell:hover {
      border-color: var(--ink-blue);
      transform: scale(1.04);
      z-index: 2;
    }

    .month-day-cell.other-month { opacity: 0.2; cursor: default; }

    .month-day-cell.tag-no_lectivo, .mini-cal-cell.tag-no_lectivo { background: var(--tag-no-lectivo-bg) !important; color: var(--tag-no-lectivo-text) !important; font-weight: 700; }
    .month-day-cell.tag-festivo, .mini-cal-cell.tag-festivo { background: var(--tag-festivo-bg) !important; color: var(--tag-festivo-text) !important; font-weight: 700; }
    .month-day-cell.tag-evaluacion, .mini-cal-cell.tag-evaluacion { background: var(--tag-evaluacion-bg) !important; color: var(--tag-evaluacion-text) !important; font-weight: 700; }
    .month-day-cell.tag-ccp, .mini-cal-cell.tag-ccp { background: var(--tag-ccp-bg) !important; color: var(--tag-ccp-text) !important; font-weight: 700; }
    .month-day-cell.tag-claustro, .mini-cal-cell.tag-claustro { background: var(--tag-claustro-bg) !important; color: var(--tag-claustro-text) !important; font-weight: 700; }

    .month-day-cell.weekend-default, .mini-cal-cell.weekend-default { background: #FEE2E2 !important; color: #991B1B !important; font-weight: 700; }

    .annotation-mark { font-size: 0.65rem; line-height: 1; margin-top: 0.1rem; }

    .lesson-badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-sm);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .lesson-badge.explicacion { background: var(--lesson-explicacion-bg); color: var(--lesson-explicacion-text); }
    .lesson-badge.correccion { background: var(--lesson-correccion-bg); color: var(--lesson-correccion-text); }
    .lesson-badge.actividades { background: var(--lesson-actividades-bg); color: var(--lesson-actividades-text); }
    .lesson-badge.examen { background: var(--lesson-examen-bg); color: var(--lesson-examen-text); font-weight: 800; border: 1px solid #FCA5A5; }
    .lesson-badge.tesa { background: var(--lesson-tesa-bg); color: var(--lesson-tesa-text); }

    .badge-note-general { background: #E2E8F0; color: #334155; font-weight: 700; }
    .badge-note-programacion { background: #DCFCE7; color: #15803D; font-weight: 700; }
    .badge-note-proyectos { background: #FEF3C7; color: #B45309; font-weight: 700; }
    .badge-note-departamento { background: #FDF2F4; color: #7A2638; border: 1px solid #FCA5A5; font-weight: 700; }

    .slot-row {
      display: flex;
      flex-direction: column;
      padding: 0.5rem 0.6rem;
      border-radius: var(--radius-md);
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      margin-bottom: 0.35rem;
      transition: all 0.15s ease;
    }

    .slot-row.slot-patio {
      background: #FEF3C7;
      border: 1px dashed #F59E0B;
      color: #92400E;
      text-align: center;
      font-weight: 700;
      padding: 0.3rem 0.5rem;
    }

    .slot-time-badge {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--ink-blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media (max-width: 1024px) {
      .weekly-days-row-5 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    }

    @media (max-width: 850px) {
      .mobile-nav-toggle { display: flex; }
      .balanced-2x2-grid { grid-template-columns: 1fr; }
      .month-day-cell { min-height: 44px; padding: 0.2rem; }
      .sidebar { position: fixed; left: -280px; top: 0; bottom: 0; z-index: 100; }
      .sidebar.open { transform: translateX(280px); }
      .sidebar-overlay { position: fixed; inset: 0; background: rgba(30, 46, 64, 0.5); backdrop-filter: blur(4px); z-index: 90; }
    }

    .mini-calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.25rem;
      text-align: center;
      margin-top: 0.5rem;
    }
    
    .mini-cal-day-header {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      padding-bottom: 0.2rem;
    }
    .mini-cal-day-header.weekend { color: #DC2626; }

    .mini-cal-cell {
      padding: 0.3rem 0.1rem;
      font-size: 0.8rem;
      border-radius: var(--radius-sm);
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
      min-height: 38px;
    }

    .mini-cal-cell:hover { border-color: var(--ink-blue); transform: scale(1.05); }

    .mini-cal-cell.today {
      border: 2px solid var(--gold-accent) !important;
      font-weight: 800;
      box-shadow: 0 2px 5px rgba(196, 154, 69, 0.3);
    }

    .mini-cal-cell.other-month { opacity: 0.25; cursor: default; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 1000;
    }

    .modal-content {
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      max-width: 840px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }

    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card-subtle);
    }

    .modal-body { padding: 1.5rem; }
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: flex-end;
      gap: 0.6rem;
      background: var(--bg-card-subtle);
    }

    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--ink-blue); margin-bottom: 0.3rem; }
    .form-control {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 0.9rem;
      background-color: var(--bg-card-subtle);
    }
    textarea.form-control { min-height: 80px; resize: vertical; }

    /* Rich Text Editor */
    .rte-toolbar { display: flex; gap: 0.3rem; padding: 0.45rem 0.6rem; background: var(--bg-card-subtle); border: 1px solid var(--border-subtle); border-bottom: none; border-radius: var(--radius-sm) var(--radius-sm) 0 0; flex-wrap: wrap; align-items: center; }
    .rte-sep { width: 1px; height: 20px; background: var(--border-subtle); margin: 0 0.2rem; }
    .rte-btn { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 0.2rem 0.55rem; cursor: pointer; font-size: 0.85rem; color: var(--text-primary); transition: background 0.15s, border-color 0.15s; line-height: 1.4; min-width: 28px; text-align: center; }
    .rte-btn:hover { background: var(--gold-light); border-color: var(--gold-accent); color: var(--ink-blue); }
    .rte-btn.active { background: var(--ink-blue); border-color: var(--ink-blue); color: #fff; }
    .rte-btn-bold { font-weight: 700; }
    .rte-btn-italic { font-style: italic; }
    .rte-btn-underline { text-decoration: underline; }
    .rte-select { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 0.18rem 0.35rem; font-size: 0.8rem; color: var(--text-primary); cursor: pointer; height: 26px; }
    .rte-select:focus { outline: none; border-color: var(--gold-accent); }
    .rte-color { width: 26px; height: 26px; border: 1px solid var(--border-subtle); border-radius: 4px; padding: 1px; cursor: pointer; background: none; }
    .rte-editor { min-height: 120px; padding: 0.65rem 0.85rem; border: 1px solid var(--border-subtle); border-radius: 0 0 var(--radius-sm) var(--radius-sm); background: #fff; font-size: 0.95rem; line-height: 1.6; color: var(--text-primary); outline: none; cursor: text; }
    .rte-editor:empty:before { content: attr(data-placeholder); color: var(--text-muted); pointer-events: none; }
    .rte-editor:focus { border-color: var(--gold-accent); box-shadow: 0 0 0 3px rgba(196,154,69,0.12); }
    .rte-content b, .rte-content strong, .rte-editor b, .rte-editor strong { font-weight: 700; }
    .rte-content i, .rte-content em, .rte-editor i, .rte-editor em { font-style: italic; }
    .rte-content u, .rte-editor u { text-decoration: underline; }
    .rte-content ul, .rte-editor ul { list-style-type: disc; padding-left: 1.75em; margin: 0.35em 0; }
    
    /* CSS counter for ordered lists so hiding/deleting a number never breaks the sequence */
    .rte-content ol, .rte-editor ol {
      list-style-type: none;
      counter-reset: rte-list-counter var(--ol-start, 0);
      padding-left: 1.75em;
      margin: 0.35em 0;
    }
    .rte-content ol > li, .rte-editor ol > li {
      counter-increment: rte-list-counter;
      position: relative;
      margin: 0.25em 0;
    }
    .rte-content ol > li[data-no-number="true"], .rte-editor ol > li[data-no-number="true"],
    .rte-content ol > li.no-number, .rte-editor ol > li.no-number,
    .rte-content ol > li[style*="list-style-type: none"], .rte-editor ol > li[style*="list-style-type: none"],
    .rte-content ol > li[style*="list-style: none"], .rte-editor ol > li[style*="list-style: none"] {
      counter-increment: none;

    function formatDateDDMMYYYY(dateVal) {
      if (!dateVal) return '';
      if (dateVal instanceof Date) {
        if (isNaN(dateVal.getTime())) return '';
        const day = String(dateVal.getDate()).padStart(2, '0');
        const month = String(dateVal.getMonth() + 1).padStart(2, '0');
        const year = dateVal.getFullYear();
        return `${day}/${month}/${year}`;
      }
      const str = String(dateVal).trim();
      if (str.includes('-')) {
        const cleanStr = str.split('T')[0];
        const parts = cleanStr.split('-');
        if (parts.length === 3 && parts[0].length === 4) {
          return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
        }
      }
      const d = new Date(str);
      if (isNaN(d.getTime())) return str;
      const dayNum = String(d.getDate()).padStart(2, '0');
      const monthNum = String(d.getMonth() + 1).padStart(2, '0');
      const yearNum = d.getFullYear();
      return `${dayNum}/${monthNum}/${yearNum}`;
    }

    function getDailyQuote() {
      const now = new Date();
      const startOfYear = new Date(now.getFullYear(), 0, 0);
      const diff = now - startOfYear;
      const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
      return LITERARY_QUOTES[dayOfYear % LITERARY_QUOTES.length];
    }



    function getISOWeekNumber(dateObj) {
      const d = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function calculateSchoolDays(startDateStr, endDateStr, holidayEvents = []) {
      let start = new Date(startDateStr);
      let end = new Date(endDateStr);
      let count = 0;
      let cur = new Date(start);

      const holidaySet = new Set((holidayEvents || []).filter(e => e.type === 'festivo' || e.type === 'vacaciones' || e.tag === 'festivo' || e.tag === 'no_lectivo').map(e => e.date));

      while (cur <= end) {
        const dayOfWeek = cur.getDay();
        const yyyy = cur.getFullYear();
        const mm = String(cur.getMonth() + 1).padStart(2, '0');
        const dd = String(cur.getDate()).padStart(2, '0');
        const dateStr = `${yyyy}-${mm}-${dd}`;

        if (dayOfWeek !== 0 && dayOfWeek !== 6 && !holidaySet.has(dateStr)) {
          count++;
        }
        cur.setDate(cur.getDate() + 1);
      }
      return count;
    }

    function getReorderedSchoolMonths() {
      const today = new Date();
      const currentMonthNum = today.getMonth() + 1;
      const currentYear = today.getFullYear();

      const SCHOOL_MONTHS = [
        { name: 'Septiembre 2026', year: 2026, monthNum: 9 },
        { name: 'Octubre 2026', year: 2026, monthNum: 10 },
        { name: 'Noviembre 2026', year: 2026, monthNum: 11 },

        { name: 'Marzo 2027', year: 2027, monthNum: 3 },
        { name: 'Abril 2027', year: 2027, monthNum: 4 },
        { name: 'Mayo 2027', year: 2027, monthNum: 5 },
        { name: 'Junio 2027', year: 2027, monthNum: 6 }
      ];
      const currentIdx = SCHOOL_MONTHS.findIndex(m => m.year === currentYear && m.monthNum === currentMonthNum);

      if (currentIdx <= 0) {
        return SCHOOL_MONTHS;
      }

      const upcoming = SCHOOL_MONTHS.slice(currentIdx);
      const past = SCHOOL_MONTHS.slice(0, currentIdx);
      return [...upcoming, ...past];

    // --- CLOUD SYNC ENGINE — Firebase Realtime Database REST API ---
    // Database: planificador-nuria-default-rtdb (Google Firebase, free tier)
    // Rules: test mode (public read/write) — no auth required
    // API: PUT /planificador/{pin}.json  → write
    //      GET /planificador/{pin}.json  → read

    const FIREBASE_DB = 'https://planificador-nuria-default-rtdb.europe-west1.firebasedatabase.app';
    const FIREBASE_SECRET = ''; // Poner la clave secreta de la base de datos si se configura la Opción 2

    async function autoPushToCloud(pin, dataObj) {
      if (!pin || typeof pin !== 'string') return;
      const cleanPin = pin.trim().replace(/[^a-zA-Z0-9]/g, '_');
      if (cleanPin.length < 4) return;

      const payload = { ...dataObj, _lastUpdated: Date.now() };
      const payloadStr = JSON.stringify(payload);

      // 1. Save locally
      try { localStorage.setItem('planificador_docente_nuria_rt_2026_2027', payloadStr); } catch(e) {}

      // 2. Push to Firebase
      try {
        const authQuery = FIREBASE_SECRET ? `?auth=${FIREBASE_SECRET}` : '';
        await fetch(`${FIREBASE_DB}/planificador/${cleanPin}.json${authQuery}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: payloadStr
        });
      } catch(e) {
        console.warn('Firebase push error:', e);
      }
    }

    async function autoFetchFromCloud(pin, onNewData) {
      if (!pin || typeof pin !== 'string') return false;
      const cleanPin = pin.trim().replace(/[^a-zA-Z0-9]/g, '_');
      if (cleanPin.length < 4) return false;

      try {
        const authQuery = FIREBASE_SECRET ? `auth=${FIREBASE_SECRET}&` : '';
        const res = await fetch(`${FIREBASE_DB}/planificador/${cleanPin}.json?${authQuery}nocache=${Date.now()}`);
        if (!res.ok) return false;
        const remoteData = await res.json();
        if (!remoteData || typeof remoteData !== 'object') return false;

        const remoteTime = remoteData._lastUpdated || 0;
        let localTime = 0;
        try {
          const loc = localStorage.getItem('planificador_docente_nuria_rt_2026_2027');
          if (loc) localTime = JSON.parse(loc)._lastUpdated || 0;
        } catch(e) {}

        if (remoteTime > localTime + 500) {
          onNewData(remoteData);
          return true;
        }
      } catch(e) {
        console.warn('Firebase fetch error:', e);
      }
      return false;
    }

      const today = new Date();

      const totalSchoolDays = calculateSchoolDays(schoolStartStr, schoolEndStr, data.calendarEvents || []);

      let remainingSchoolDays = 0;
      let daysUntilStart = 0;
      
      const nowStr = today.toISOString().split('T')[0];
      const startDate = new Date(schoolStartStr);
      const endDate = new Date(schoolEndStr);

      if (today < startDate) {
        remainingSchoolDays = totalSchoolDays;
        const diffTime = startDate - today;
        daysUntilStart = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      } else if (today > endDate) {
        remainingSchoolDays = 0;
      } else {
        remainingSchoolDays = calculateSchoolDays(nowStr, schoolEndStr, data.calendarEvents || []);
      }

      const completedDays = Math.max(0, totalSchoolDays - remainingSchoolDays);
      const progressPercent = Math.min(100, Math.round((completedDays / totalSchoolDays) * 100));

      const dayNames = ['domingo', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'sábado'];
      const dayNameCapitalized = today.toLocaleDateString('es-ES', { weekday: 'long' });
      const dateFormattedDDMMYYYY = formatDateDDMMYYYY(today);
      const dayNameEs = `${dayNameCapitalized}, ${dateFormattedDDMMYYYY}`;
      const currentDayKey = dayNames[today.getDay()];

      const currentWeek = (data.weeklyPlans && data.weeklyPlans[0]) || {};
      const todayDayInfo = currentWeek.days?.[currentDayKey] || {};
      const todaySlots = todayDayInfo.slots || {};
      const todaySlotKeys = Object.keys(todaySlots);

    // --- CALENDAR VIEW ---
    function CalendarView({ events, setEvents, onGoToWeeklyPlanner }) {
      const schoolMonthsOrdered = getReorderedSchoolMonths();
      const today = new Date();
      const [selectedDateForNotes, setSelectedDateForNotes] = useState(null);

      const handleSaveDateAnnotation = (dateStr, title, tag, time, details) => {
        if ((!tag || tag === 'ninguna') && !title.trim() && !time && !details.trim()) {
          setEvents(events.filter(e => e.date !== dateStr));
          setSelectedDateForNotes(null);
          return;
        }

        const otherEvents = events.filter(e => e.date !== dateStr);
        const newEvt = {
          id: Date.now().toString(),
          date: dateStr,
          title: title.trim(),
          tag: tag || 'ninguna',
          time: (tag === 'evaluacion' || tag === 'ccp' || tag === 'claustro') ? (time || '') : '',
          type: tag || 'nota',
          details: details || ''
        };

        setEvents([...otherEvents, newEvt]);
        setSelectedDateForNotes(null);
      };

      const handleDeleteEvt = (dateStr) => {
        setEvents(events.filter(e => e.date !== dateStr));
      };

      return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '1.25rem' } },
        h('div', { className: 'section-header', style: { marginBottom: '0.75rem' } },

            h('span', { className: 'badge', style: { background: 'var(--tag-festivo-bg)', color: 'var(--tag-festivo-text)' } }, 'Festivo'),
            h('span', { className: 'badge', style: { background: 'var(--tag-evaluacion-bg)', color: 'var(--tag-evaluacion-text)' } }, 'Evaluación'),
            h('span', { className: 'badge', style: { background: 'var(--tag-ccp-bg)', color: 'var(--tag-ccp-text)' } }, 'CCP'),
            h('span', { className: 'badge', style: { background: 'var(--tag-claustro-bg)', color: 'var(--tag-claustro-text)' } }, 'Claustro')
          )
        ),
        h('div', { className: 'all-months-container' },
          schoolMonthsOrdered.map(m => {
            const isCurrentMonthBox = m.year === today.getFullYear() && m.monthNum === (today.getMonth() + 1);
            const firstDay = new Date(m.year, m.monthNum - 1, 1).getDay();
            const totalDaysInMonth = new Date(m.year, m.monthNum, 0).getDate();

            const offset = (firstDay === 0 ? 6 : firstDay - 1);

            const monthCells = [];
            for (let i = 0; i < offset; i++) monthCells.push({ dayNum: '', isOther: true });

            for (let d = 1; d <= totalDaysInMonth; d++) {
              const dObj = new Date(m.year, m.monthNum - 1, d);
              const dayOfWeek = dObj.getDay();
              const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
              const dateStr = `${m.year}-${String(m.monthNum).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
              const dayEvt = events.find(e => e.date === dateStr);
              const tagClass = dayEvt?.tag ? `tag-${dayEvt.tag}` : (isWeekend ? 'weekend-default' : '');
              const hasVisibleMark = Boolean(dayEvt && (dayEvt.title || dayEvt.time || dayEvt.details));

              monthCells.push({ dayNum: d, dateStr, isWeekend, isOther: false, dayEvt, tagClass, hasVisibleMark });
            }

            return h('div', { key: m.name, className: `single-month-box ${isCurrentMonthBox ? 'is-current-month-box' : ''}` },
              h('h3', { className: 'single-month-title' },
                h('span', null, m.name),
                isCurrentMonthBox && h('span', { className: 'badge badge-gold', style: { fontSize: '0.65rem' } }, 'MES ACTUAL')
              ),
              h('div', { className: 'month-cal-grid' },
                h('div', { className: 'month-day-header' }, 'Lu'),
                h('div', { className: 'month-day-header' }, 'Ma'),
                h('div', { className: 'month-day-header' }, 'Mi'),
                h('div', { className: 'month-day-header' }, 'Ju'),
                h('div', { className: 'month-day-header' }, 'Vi'),
                h('div', { className: 'month-day-header weekend' }, 'Sá'),
                h('div', { className: 'month-day-header weekend' }, 'Do'),
                monthCells.map((cell, cIdx) => {
                  if (cell.isOther) return h('div', { key: cIdx, className: 'month-day-cell other-month' });
                  return h('div', {
                    key: cell.dateStr,
                    className: `month-day-cell ${cell.tagClass}`,
                    onClick: () => setSelectedDateForNotes(cell.dateStr),
                    title: cell.dayEvt ? `${cell.dayEvt.title || ''} (${formatDateDDMMYYYY(cell.dateStr)})` : `Anotación (${formatDateDDMMYYYY(cell.dateStr)})`

                    h('div', null, cell.dayNum),
                    cell.hasVisibleMark && h('div', { className: 'annotation-mark' }, `📌 ${cell.dayEvt.time || ''}`)
                  );
                })
              )
            );
          })
        ),
        selectedDateForNotes && h(DateAnnotationModal, {
          dateStr: selectedDateForNotes,
          existingEvent: events.find(e => e.date === selectedDateForNotes),
          onSave: handleSaveDateAnnotation,
          onDelete: handleDeleteEvt,
          onGoToWeeklyPlanner,
          onClose: () => setSelectedDateForNotes(null)
        })
      );

                  h('button', { type: 'submit', className: 'btn btn-primary' }, 'Guardar Anotación')
                )
              )
            )

    // --- WEEKLY PLANNER ---
    function WeeklyPlanner({ plans, setPlans, calendarEvents = [], targetDate = null }) {
      const today = new Date();
      const defaultMonday = getMondayOfDate(today);

      const [currentMondayStr, setCurrentMondayStr] = useState(() => {
        if (targetDate) return getMondayOfDate(new Date(targetDate));
        return plans[0]?.startDate || defaultMonday;
      });
      const [selectedDayKey, setSelectedDayKey] = useState(null);

      useEffect(() => {
        if (targetDate) {
          setCurrentMondayStr(getMondayOfDate(new Date(targetDate)));
        }
      }, [targetDate]);

      const days = [
        { key: 'monday', label: 'Lunes', offset: 0 },
        { key: 'tuesday', label: 'Martes', offset: 1 },
        { key: 'wednesday', label: 'Miércoles', offset: 2 },
        { key: 'thursday', label: 'Jueves', offset: 3 },
        { key: 'friday', label: 'Viernes', offset: 4 }
      ];

      const currentFridayStr = getFridayOfMonday(currentMondayStr);

      const activeWeek = plans.find(w => w.startDate === currentMondayStr) || {
        id: `w_${currentMondayStr}`,
        startDate: currentMondayStr,
        endDate: currentFridayStr,
        title: `Semana ${currentMondayStr}`,
        days: {}
      };

      const startDateObj = new Date(currentMondayStr);
      const weekNumberYear = getISOWeekNumber(startDateObj);
      const startFormatted = formatDateDDMMYYYY(currentMondayStr);
      const endFormatted = formatDateDDMMYYYY(currentFridayStr);

      const handleSaveDaySlots = (updatedDayObj) => {
        const existingIdx = plans.findIndex(w => w.startDate === currentMondayStr);
        let updatedPlans = [...plans];
        const updatedWeekObj = { ...activeWeek, days: { ...(activeWeek.days || {}), [selectedDayKey]: updatedDayObj } };

        if (existingIdx >= 0) updatedPlans[existingIdx] = updatedWeekObj;
        else updatedPlans.push(updatedWeekObj);

        setPlans(updatedPlans);
        setSelectedDayKey(null);
      };

      return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '1rem' } },
        h('div', { className: 'section-header' },
          h('div', null, h('h2', { className: 'section-title' }, 'Planificador Semanal')),
          h('div', { style: { display: 'flex', gap: '0.5rem', alignItems: 'center', flexWrap: 'wrap' } },
            h('button', { className: 'btn btn-gold', onClick: () => setCurrentMondayStr(getMondayOfDate(new Date())), style: { padding: '0.3rem 0.65rem', fontSize: '0.785rem' } }, '📍 Hoy'),
            h('div', { style: { display: 'flex', gap: '0.25rem' } },
              h('button', { className: 'btn btn-secondary', onClick: () => setCurrentMondayStr(shiftDateByDays(currentMondayStr, -7)), style: { padding: '0.3rem 0.6rem', fontSize: '0.85rem' } }, '◄ Semana Anterior'),
              h('button', { className: 'btn btn-secondary', onClick: () => setCurrentMondayStr(shiftDateByDays(currentMondayStr, 7)), style: { padding: '0.3rem 0.6rem', fontSize: '0.85rem' } }, 'Semana Siguiente ►')
            ),
            h('span', { className: 'badge badge-gold', style: { fontSize: '0.8rem', padding: '0.35rem 0.75rem' } }, `🗓️ Semana nº ${weekNumberYear} (Del ${startFormatted} al ${endFormatted})`)
          )
        ),
        h('div', { className: 'weekly-days-row-5' },
          days.map(d => {
            const dayInfo = activeWeek.days?.[d.key] || {};
            const daySlotsData = dayInfo.slots || {};
            const timeSlotsList = getTimeSlotsForDay(d.key);
            const dayDateFormatted = getFormattedDayDate(currentMondayStr, d.offset);
            const dayDateISO = shiftDateByDays(currentMondayStr, d.offset);
            const dayEvt = (calendarEvents || []).find(e => e.date === dayDateISO);

            const isWithinSchoolYear = (dayDateISO >= '2026-09-09' && dayDateISO <= '2027-06-18');

            const tag = dayEvt?.tag;
            let cardBackground = 'var(--bg-card)';
            let cardBorder = '1px solid var(--border-color)';
            let tagBadge = null;

            if (!isWithinSchoolYear) {
              cardBackground = '#FAF9F6';
              cardBorder = '1px dashed #CBD5E1';
            } else if (tag === 'festivo') {
              cardBackground = '#EFF6FF';
              cardBorder = '2px solid #2563EB';
              tagBadge = h('span', { className: 'badge', style: { background: 'var(--tag-festivo-bg)', color: 'var(--tag-festivo-text)', fontSize: '0.625rem', padding: '0.15rem 0.4rem', fontWeight: 700 } }, '🎉 Festivo');
            } else if (tag === 'no_lectivo') {
              cardBackground = '#F8FAFC';
              cardBorder = '2px solid #64748B';
              tagBadge = h('span', { className: 'badge', style: { background: 'var(--tag-no-lectivo-bg)', color: 'var(--tag-no-lectivo-text)', fontSize: '0.625rem', padding: '0.15rem 0.4rem', fontWeight: 700 } }, '🛑 No Lectivo');
            } else if (tag === 'evaluacion') {

              tagBadge = h('span', { className: 'badge', style: { background: 'var(--tag-evaluacion-bg)', color: 'var(--tag-evaluacion-text)', fontSize: '0.625rem', padding: '0.15rem 0.4rem', fontWeight: 700 } }, '📝 Evaluación');
            } else if (tag === 'ccp') {
              cardBorder = '2px solid #CA8A04';

            } else if (tag === 'claustro') {
              cardBorder = '2px solid #9333EA';
              tagBadge = h('span', { className: 'badge', style: { background: 'var(--tag-claustro-bg)', color: 'var(--tag-claustro-text)', fontSize: '0.625rem', padding: '0.15rem 0.4rem', fontWeight: 700 } }, '🎓 Claustro');

                  h('div', null,
                    h('div', { style: { display: 'flex', gap: '0.35rem', alignItems: 'center' } },
                      h('h4', { style: { fontSize: '1.05rem', color: isWithinSchoolYear ? 'var(--ink-blue)' : 'var(--text-muted)', lineHeight: 1.1 } }, d.label),
                      tagBadge
                    ),
                    h('span', { style: { fontSize: '0.75rem', fontWeight: 700, color: 'var(--gold-accent)' } }, dayDateFormatted)
                  ),
                  isWithinSchoolYear ? h('span', { className: 'badge badge-gold', style: { fontSize: '0.625rem', padding: '0.15rem 0.35rem' } }, 'Programar ✍️') : h('span', { style: { fontSize: '0.625rem', color: 'var(--text-muted)', fontStyle: 'italic' } }, 'Sin lectiva')
                ),

                !isWithinSchoolYear ? h('div', { style: { height: '400px' } }) : h(React.Fragment, null,

                  (tag === 'festivo' || tag === 'no_lectivo') && h('div', {

                      background: tag === 'festivo' ? 'var(--tag-festivo-bg)' : 'var(--tag-no-lectivo-bg)',

                      fontWeight: 700,
                      fontSize: '0.775rem',
                      marginBottom: '0.65rem',

                    }
                  }, tag === 'festivo' ? `🎉 FESTIVO ${dayEvt?.title ? `— ${dayEvt.title}` : ''}` : `🛑 NO LECTIVO ${dayEvt?.title ? `— ${dayEvt.title}` : ''}`),

                  h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.4rem' } },
                    timeSlotsList.map(slot => {

                      const blocks = slotData?.blocks || [];

                        );
                      }

                      return h('div', { key: slot.time, className: 'slot-row' },
                        h('div', { className: 'slot-time-badge' },
                          h('span', null, `${slot.label} (${slot.time})`),
                          slotData?.subject && h('span', { style: { color: 'var(--gold-accent)' } }, slotData.group)
                        ),
                        slotData && (slotData.subject || blocks.length > 0) ? h('div', { style: { marginTop: '0.25rem' } },
                          slotData.subject && h('div', { style: { fontSize: '0.725rem', fontWeight: 700, color: 'var(--ink-blue)', marginBottom: '0.2rem' } }, `${slotData.subject} (${slotData.group || ''})`),
                          h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.25rem' } },
                            blocks.map((blk, bIdx) => {
                              const lessonObj = LESSON_TYPES.find(l => l.key === blk.type);
                              return h('div', { key: bIdx, style: { fontSize: '0.725rem', lineHeight: 1.25, display: 'flex', gap: '0.3rem', alignItems: 'flex-start', flexWrap: 'wrap' } },

            );

        ),
        selectedDayKey && h(TimeSlotDayModal, {
          dayKey: selectedDayKey,
          dayName: days.find(d => d.key === selectedDayKey)?.label,
          dayDateFormatted: getFormattedDayDate(currentMondayStr, days.find(d => d.key === selectedDayKey)?.offset || 0),
